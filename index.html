<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Loyalty Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{margin:0;background:linear-gradient(180deg,#0c0a0a,#1a1a1a);color:#fff}
.app{max-width:420px;margin:auto;min-height:100vh;padding:20px}
.header{text-align:center;margin-bottom:25px}
.header h1{color:#1E90FF;margin:0}

.card{
  background:linear-gradient(135deg,#1E90FF,#00C6FF);
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  margin-bottom:30px;
  position:relative;
}
.point{font-size:60px;font-weight:bold}

.plus-one{
  position:absolute;
  font-size:22px;
  font-weight:bold;
  color:#FFD700;
  animation:floatUp 1s ease forwards;
}
@keyframes floatUp{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-40px)}
}

/* REWARD */
.reward{
  margin-top:15px;
  background:gold;
  color:#000;
  padding:16px;
  border-radius:14px;
  font-weight:bold;
  animation:pop .4s,glow 1.5s infinite alternate;
}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes glow{
  from{box-shadow:0 0 10px gold}
  to{box-shadow:0 0 25px orange}
}

/* FORM */
.form-box{
  background:#f1f1f7;
  color:#000;
  padding:20px;
  border-radius:16px;
}
.form-box input,.form-box button{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:10px;
  border:1px solid #ccc;
}
.form-box button{
  background:#1E90FF;
  color:#fff;
  border:none;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<script>
// 📅 AUTO SET TANGGAL HARI INI (TANPA UBAH SCRIPT ASLI)
document.addEventListener("DOMContentLoaded", function(){
  const tglInput = document.getElementById("tgl");
  if(!tglInput) return;

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");

  const todayStr = `${yyyy}-${mm}-${dd}`;

  tglInput.value = todayStr;

  // 🔒 KUNCI AGAR TIDAK BISA DIGANTI
  tglInput.setAttribute("readonly", true);
  tglInput.addEventListener("click", e => e.preventDefault());
});
</script>
<script>
function animatePlus(){
  const card = document.getElementById("card");
  const plus = document.createElement("div");
  plus.className = "plus-one";
  plus.innerText = "+1";
  plus.style.left = "50%";
  plus.style.top = "50%";
  plus.style.transform = "translate(-50%, -50%)";
  card.appendChild(plus);
  setTimeout(()=>plus.remove(),1000);
}

function showReward(cycle){
  const card = document.getElementById("card");
  const reward = document.createElement("div");
  reward.className = "reward";
  reward.innerText = `🎁 REWARD KE-${cycle} 🎁`;
  card.appendChild(reward);
  setTimeout(()=>reward.remove(),3000);
}
</script>

<body>
<div class="app">

  <div class="header">
    <h1>LOYALTY CARD WIJAYA BARBERS</h1>
    <p>Collect • Earn • Reward</p>
  </div>

  <div class="card" id="card">
    <div style="font-size:14px;opacity:.9">TOTAL POINT</div>
    <div class="point" id="point">0</div>
    <div style="font-size:14px;letter-spacing:2px">POINT</div>
  </div>

  <form class="form-box" onsubmit="return handleSubmit()">


    <input type="text" id="nama" name="nama_lengkap" placeholder="Nama Lengkap" required>
    <input type="date" id="tgl" name="tgl" required>
    <button type="submit">Simpan Point</button>
  </form>

</div>

<script>
const MAX_POINT = 8;
const PASSWORD = "2310";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZBuUDRYvUneK_J6F49jHpdzxTQnIAzz5zWyCJrGtalkuAaiCo8gsAvuallEruIxdf/exec";

function handleSubmit(){

  // 🔐 PASSWORD
  const inputPass = prompt("Masukkan Password:");
  if(inputPass === null) return false;
  if(inputPass !== PASSWORD){
    alert("❌ Password salah!");
    return false;
  }

  const nama = document.getElementById("nama").value.trim().toLowerCase();
  const tanggal = document.getElementById("tgl").value;

  if(!nama){
    alert("Nama wajib diisi");
    return false;
  }

  const pointKey = "point_" + nama;
  const cycleKey = "cycle_" + nama;
  const dateKey  = "lastdate_" + nama;

  if(localStorage.getItem(dateKey) === tanggal){
    alert("⚠️ Point hari ini sudah diambil");
    return false;
  }

  let point = parseInt(localStorage.getItem(pointKey)) || 0;
  let cycle = parseInt(localStorage.getItem(cycleKey)) || 0;

  // ➕ TAMBAH POINT
  point++;
  animatePlus();

  // 🎁 REWARD
  if(point >= MAX_POINT){
    cycle++;
    localStorage.setItem(cycleKey, cycle);
    point = 0;
    showReward(cycle);
  }

  localStorage.setItem(pointKey, point);
  localStorage.setItem(dateKey, tanggal);
  updatePointDisplay(nama);


  // 🚀 KIRIM DATA TANPA PINDAH HALAMAN
  fetch(SCRIPT_URL, {
    method: "POST",
    body: new URLSearchParams({
      nama_lengkap: nama,
      tgl: tanggal
    })
  });

  return false; // ⛔ PENTING: cegah reload / pindah halaman
}
</script>
<script>
function updatePointDisplay(nama){
  const pointKey = "point_" + nama;
  const point = parseInt(localStorage.getItem(pointKey)) || 0;
  document.getElementById("point").innerText = point;
}
</script>
